[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "james-clarke/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Path that installers should place binaries in. Not CARGO_HOME: most people
# downloading a built binary do not have Rust, and ~/.local/bin is already on
# PATH on current distros. Homebrew ignores this and uses its own prefix.
install-path = "~/.local/bin"
# Whether to run the build in the pull request in a plan-only mode
pr-run-mode = "plan"
# macOS signing waits for the Developer ID certificate: turning it on without
# CODESIGN_CERTIFICATE / _PASSWORD / _IDENTITY in the repo secrets fails the
# release build. Flip it back on with the cert and add a notarization step.
macos-sign = false
