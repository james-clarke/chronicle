[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
ksni = "0.3"
# Same executor selection as ksni so the two share one zbus build.
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "1"
jiff = { version = "0.2", features = ["serde"] }
# Exact pin on purpose: no semver discipline upstream (see README stack table).
llama-cpp-2 = "=0.1.154"
# Exact pin on purpose (README stack table): official SDK, fast-moving API.
rmcp = { version = "=3.1.4", default-features = false, features = ["client", "transport-child-process"] }
encoding_rs = "0.8"
num_cpus = "1"
regex = "1"
serde_json = "1"
sha2 = "0.10"
strsim = "0.11"
ureq = "3"
x11rb = { version = "0.14", features = ["screensaver", "xinput"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
signal-hook = "0.4"
directories = "6"
eframe = "0.36"
chronicle-core = { path = "crates/core" }
chronicle-capture = { path = "crates/capture" }
chronicle-server = { path = "crates/server" }
chronicle-derive = { path = "crates/derive" }
chronicle-mcp = { path = "crates/mcp" }

# llama.cpp at -O0 is unusable for inference; keep the C/C++ side optimized
# even in dev builds (the cmake crate maps opt-level 0 to a Debug build).
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
debug = false

# Installed binary embeds llama.cpp; thin LTO + one codegen unit + stripped symbols
# cut size and keep link time bounded. No panic = "abort": capture pollers and the
# server rely on a panicking thread dying alone (see server's poison recovery).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
